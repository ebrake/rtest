name: RCLayer Python 3.15 wheels

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'rclayer/rtest'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1.51.0
        with:
          args: --release --out dist --interpreter python3.15
          manylinux: 'off'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rtest-python315-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.whl
